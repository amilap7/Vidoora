<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Vidoora - Admin Login</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    background:#0b0b0d;
    color:#fff;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.box{
    width:100%;
    max-width:420px;
    background:#151519;
    border:1px solid #303035;
    border-radius:20px;
    padding:30px 22px;
}

.logo{
    text-align:center;
    font-size:29px;
    font-weight:800;
    margin-bottom:10px;
}

.logo span{
    color:#ff1744;
}

.admin-label{
    text-align:center;
    color:#ff1744;
    font-size:12px;
    font-weight:bold;
    margin-bottom:25px;
}

h1{
    font-size:25px;
    margin-bottom:8px;
}

.subtitle{
    color:#999;
    font-size:14px;
    margin-bottom:22px;
}

label{
    display:block;
    font-size:13px;
    font-weight:bold;
    margin:15px 0 7px;
}

input{
    width:100%;
    height:46px;
    padding:0 14px;
    border-radius:10px;
    border:1px solid #35353d;
    background:#202027;
    color:#fff;
    outline:none;
}

input:focus{
    border-color:#ff1744;
}

button{
    width:100%;
    height:46px;
    margin-top:22px;
    border:0;
    border-radius:10px;
    background:#ff1744;
    color:#fff;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
}

button:disabled{
    opacity:.6;
}

.message{
    display:none;
    margin-top:15px;
    padding:11px;
    border-radius:9px;
    font-size:13px;
    text-align:center;
    line-height:1.4;
}

.error{
    background:#35151b;
    color:#ff8a9d;
}

.links{
    text-align:center;
    margin-top:20px;
}

.links a{
    color:#888;
    text-decoration:none;
    font-size:13px;
}

</style>

</head>

<body>

<div class="box">

    <div class="logo">
        Vid<span>o</span>ora
    </div>

    <div class="admin-label">
        ADMIN ACCESS
    </div>

    <h1>Admin Login</h1>

    <p class="subtitle">
        This area is restricted to authorized administrators.
    </p>

    <label>Admin Email</label>

    <input
        type="email"
        id="email"
        placeholder="Admin email"
        autocomplete="username"
    >

    <label>Password</label>

    <input
        type="password"
        id="password"
        placeholder="Admin password"
        autocomplete="current-password"
    >

    <button
        id="loginBtn"
        onclick="adminLogin()"
    >
        Admin Login
    </button>

    <div
        class="message error"
        id="errorMessage"
    ></div>

    <div class="links">

        <a href="index.html">
            ← Back to Vidoora
        </a>

    </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
    "https://lfsjnghkgzsghhcexgsu.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_xkvVadBo9ApuaE81iWdAsQ_Q8F5Efvv";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


function showError(message){

    const box =
        document.getElementById(
            "errorMessage"
        );

    box.textContent = message;
    box.style.display = "block";

}


async function adminLogin(){

    const email =
        document.getElementById(
            "email"
        ).value.trim();

    const password =
        document.getElementById(
            "password"
        ).value;


    if(!email || !password){

        showError(
            "Please enter admin email and password."
        );

        return;

    }


    const button =
        document.getElementById(
            "loginBtn"
        );

    button.disabled = true;
    button.textContent =
        "Checking...";


    const {
        data,
        error
    } =
        await supabaseClient.auth.signInWithPassword({

            email:email,
            password:password

        });


    if(error){

        showError(
            "Invalid admin email or password."
        );

        button.disabled = false;
        button.textContent =
            "Admin Login";

        return;

    }


    const user =
        data.user;


    const {
        data:admin,
        error:adminError
    } =
        await supabaseClient
            .from("admin_users")
            .select("user_id")
            .eq(
                "user_id",
                user.id
            )
            .maybeSingle();


    if(adminError || !admin){

        await supabaseClient.auth.signOut();

        showError(
            "This account is not authorized as an admin."
        );

        button.disabled = false;
        button.textContent =
            "Admin Login";

        return;

    }


    window.location.href =
        "add-video.html";

}

</script>

</body>
</html>
