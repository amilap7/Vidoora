<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Vidoora - Discover & Watch</title>

<meta name="description" content="Vidoora - Discover and watch videos.">
<meta name="theme-color" content="#0b0b0d">

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif
}

body{
  background:#0b0b0d;
  color:#fff;
  min-height:100vh
}

a{
  text-decoration:none;
  color:inherit
}

/* HEADER */

header{
  position:sticky;
  top:0;
  z-index:100;
  background:rgba(11,11,13,.96);
  border-bottom:1px solid #242428;
  backdrop-filter:blur(10px)
}

.header-inner{
  max-width:1400px;
  margin:auto;
  padding:14px 18px;
  display:flex;
  align-items:center;
  gap:15px
}

.logo{
  font-size:27px;
  font-weight:800;
  letter-spacing:-1px;
  white-space:nowrap
}

.logo span{
  color:#ff1744
}

.search-box{
  flex:1;
  position:relative
}

.search-box input{
  width:100%;
  padding:12px 16px;
  border-radius:25px;
  border:1px solid #303036;
  background:#17171b;
  color:#fff;
  outline:none;
  font-size:14px
}

.search-box input:focus{
  border-color:#ff1744
}

.menu-btn{
  width:42px;
  height:42px;
  border:0;
  border-radius:50%;
  background:#18181c;
  color:#fff;
  font-size:22px;
  cursor:pointer
}

/* HERO */

.hero{
  max-width:1400px;
  margin:auto;
  padding:35px 18px 25px
}

.hero h1{
  font-size:38px;
  margin-bottom:8px
}

.hero p{
  color:#999;
  font-size:15px
}

/* CATEGORIES */

.categories{
  max-width:1400px;
  margin:auto;
  padding:0 18px 25px;
  display:flex;
  gap:10px;
  overflow-x:auto;
  scrollbar-width:none
}

.categories::-webkit-scrollbar{
  display:none
}

.category-btn{
  flex:0 0 auto;
  border:1px solid #303036;
  background:#151519;
  color:#bbb;
  padding:10px 18px;
  border-radius:22px;
  cursor:pointer;
  font-size:14px
}

.category-btn.active,
.category-btn:hover{
  background:#ff1744;
  color:#fff;
  border-color:#ff1744
}

/* VIDEO GRID */

.video-grid{
  max-width:1400px;
  margin:auto;
  padding:0 18px 40px;
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:15px
}

.video-card{
  background:#151519;
  border:1px solid #242428;
  border-radius:14px;
  overflow:hidden;
  transition:.2s
}

.video-card:hover{
  transform:translateY(-3px);
  border-color:#3a3a40
}

.thumbnail{
  position:relative;
  aspect-ratio:16/9;
  background:#202025;
  overflow:hidden
}

.thumbnail img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block
}

.play-icon{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  width:52px;
  height:52px;
  border-radius:50%;
  background:rgba(255,23,68,.92);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:22px;
  padding-left:3px
}

.duration{
  position:absolute;
  right:8px;
  bottom:8px;
  background:rgba(0,0,0,.82);
  padding:5px 7px;
  border-radius:5px;
  font-size:11px
}

.video-info{
  padding:13px
}

.video-title{
  font-size:15px;
  font-weight:700;
  line-height:1.35;
  margin-bottom:7px
}

.video-meta{
  color:#888;
  font-size:12px;
  margin-bottom:12px
}

.watch-btn{
  display:block;
  width:100%;
  text-align:center;
  padding:10px;
  border-radius:8px;
  background:#ff1744;
  color:#fff;
  font-size:13px;
  font-weight:700
}

.watch-btn:hover{
  background:#e9143e
}

/* EMPTY */

.empty{
  grid-column:1/-1;
  text-align:center;
  padding:60px 20px;
  color:#777;
  display:none
}

.empty h2{
  color:#aaa;
  margin-bottom:7px
}

/* AGE WARNING */

.age-overlay{
  position:fixed;
  inset:0;
  z-index:9999;
  background:rgba(0,0,0,.96);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px
}

.age-box{
  width:100%;
  max-width:420px;
  text-align:center;
  background:#151519;
  border:1px solid #303036;
  border-radius:18px;
  padding:30px 22px
}

.age-icon{
  font-size:48px;
  margin-bottom:12px
}

.age-box h2{
  margin-bottom:10px
}

.age-box p{
  color:#999;
  font-size:14px;
  line-height:1.5;
  margin-bottom:22px
}

.age-actions{
  display:flex;
  gap:10px
}

.age-actions button{
  flex:1;
  padding:12px;
  border:0;
  border-radius:9px;
  cursor:pointer;
  font-weight:700
}

.enter-btn{
  background:#ff1744;
  color:#fff
}

.leave-btn{
  background:#29292e;
  color:#fff
}

/* FOOTER */

footer{
  border-top:1px solid #242428;
  padding:25px 18px;
  text-align:center;
  color:#666;
  font-size:12px
}

/* RESPONSIVE */

@media(min-width:700px){
  .video-grid{
    grid-template-columns:repeat(3,minmax(0,1fr))
  }
}

@media(min-width:1100px){
  .video-grid{
    grid-template-columns:repeat(4,minmax(0,1fr))
  }
}

@media(max-width:500px){
  .hero h1{
    font-size:30px
  }

  .logo{
    font-size:23px
  }

  .header-inner{
    padding:12px
  }

  .video-grid{
    padding-left:12px;
    padding-right:12px;
    gap:10px
  }

  .categories{
    padding-left:12px;
    padding-right:12px
  }

  .video-info{
    padding:10px
  }

  .video-title{
    font-size:13px
  }

  .watch-btn{
    font-size:12px;
    padding:9px
  }
}
</style>
</head>

<body>

<!-- AGE WARNING -->
<div class="age-overlay" id="ageOverlay">
  <div class="age-box">

    <div class="age-icon">🔞</div>

    <h2>18+ Only</h2>

    <p>
      This website contains adult-oriented content.
      You must be 18 years or older to continue.
    </p>

    <div class="age-actions">
      <button class="enter-btn" onclick="enterSite()">
        I am 18+
      </button>

      <button class="leave-btn" onclick="leaveSite()">
        Leave
      </button>
    </div>

  </div>
</div>

<!-- HEADER -->
<header>
  <div class="header-inner">

    <div class="logo">
      Vid<span>o</span>ora
    </div>

    <div class="search-box">
      <input
        type="search"
        id="searchInput"
        placeholder="Search videos..."
        autocomplete="off"
      >
    </div>

    <button class="menu-btn" onclick="openAddVideo()">
      +
    </button>

  </div>
</header>

<!-- HERO -->
<section class="hero">
  <h1>Discover Videos</h1>
  <p>Watch. Discover. Enjoy.</p>
</section>

<!-- CATEGORIES -->
<div class="categories">

  <button
    class="category-btn active"
    data-category="All"
    onclick="filterCategory('All',this)">
    All
  </button>

  <button
    class="category-btn"
    data-category="Popular"
    onclick="filterCategory('Popular',this)">
    Popular
  </button>

  <button
    class="category-btn"
    data-category="New"
    onclick="filterCategory('New',this)">
    New
  </button>

  <button
    class="category-btn"
    data-category="Trending"
    onclick="filterCategory('Trending',this)">
    Trending
  </button>

</div>

<!-- VIDEO GRID -->
<div class="video-grid" id="videoGrid">

  <div class="empty" id="emptyMessage">
    <h2>No videos found</h2>
    <p>Try another search or category.</p>
  </div>

</div>

<footer>
  © 2026 Vidoora. All rights reserved.
</footer>

<script>

/* =====================================================
   SUPABASE SETTINGS
   ADD YOUR OWN VALUES HERE
   ===================================================== */

const SUPABASE_URL = "https://lfsjnghkgzsghhcexgsu.supabase.co";

const SUPABASE_KEY ="sb_publishable_xkvVadBo9ApuaE81iWdAsQ_Q8F5Efvv";


/* =====================================================
   VARIABLES
   ===================================================== */

let allVideos = [];
let currentCategory = "All";


/* =====================================================
   AGE CHECK
   ===================================================== */

function enterSite(){

  localStorage.setItem("vidooraAgeVerified","yes");

  document.getElementById("ageOverlay").style.display="none";
}

function leaveSite(){

  window.location.href="https://www.google.com/";
}

if(localStorage.getItem("vidooraAgeVerified")==="yes"){

  document.getElementById("ageOverlay").style.display="none";
}


/* =====================================================
   ADD VIDEO PAGE
   ===================================================== */

function openAddVideo(){

  window.location.href="add-video.html";
}


/* =====================================================
   ESCAPE HTML
   ===================================================== */

function escapeHTML(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}


/* =====================================================
   LOAD VIDEOS FROM SUPABASE
   ===================================================== */

async function loadVideos(){

  const grid = document.getElementById("videoGrid");

  if(
    SUPABASE_URL.includes("PASTE_YOUR") ||
    SUPABASE_KEY.includes("PASTE_YOUR")
  ){

    grid.innerHTML = `
      <div class="empty" style="display:block">
        <h2>Supabase not connected</h2>
        <p>Add your Supabase URL and public key to index.html.</p>
      </div>
    `;

    return;
  }

  try{

    const response = await fetch(
      SUPABASE_URL +
      "/rest/v1/videos?select=*&order=created_at.desc",
      {
        method:"GET",

        headers:{
          "apikey":SUPABASE_KEY,
          "Authorization":"Bearer "+SUPABASE_KEY
        }
      }
    );

    if(!response.ok){

      throw new Error(
        "Supabase request failed: "+response.status
      );
    }

    allVideos = await response.json();

    renderVideos();

  }catch(error){

    console.error(error);

    grid.innerHTML = `
      <div class="empty" style="display:block">
        <h2>Unable to load videos</h2>
        <p>Please check your Supabase settings.</p>
      </div>
    `;
  }
}


/* =====================================================
   RENDER VIDEOS
   ===================================================== */

function renderVideos(){

  const grid = document.getElementById("videoGrid");
  const search = document
    .getElementById("searchInput")
    .value
    .toLowerCase()
    .trim();

  grid.innerHTML="";

  const filtered = allVideos.filter(video=>{

    const title = String(video.title || "").toLowerCase();

    const category =
      String(video.category || "New");

    const matchesSearch =
      title.includes(search);

    const matchesCategory =
      currentCategory==="All" ||
      category===currentCategory;

    return matchesSearch && matchesCategory;

  });

  if(filtered.length===0){

    grid.innerHTML=`
      <div class="empty" style="display:block">
        <h2>No videos found</h2>
        <p>Try another search or category.</p>
      </div>
    `;

    return;
  }

  filtered.forEach(video=>{

    const title =
      escapeHTML(video.title || "Untitled Video");

    const image =
      escapeHTML(
        video.image ||
        "https://via.placeholder.com/640x360?text=Vidoora"
      );

    const duration =
      escapeHTML(video.duration || "00:00");

    const views =
      escapeHTML(video.views || "0");

    const category =
      escapeHTML(video.category || "New");

    const videoURL =
      escapeHTML(video.video || "#");

    const card = document.createElement("div");

    card.className="video-card";

    card.innerHTML=`

      <div class="thumbnail">

        <img
          src="${image}"
          alt="${title}"
          loading="lazy"
          onerror="this.src='https://via.placeholder.com/640x360?text=Vidoora'"
        >

        <div class="play-icon">
          ▶
        </div>

        <div class="duration">
          ${duration}
        </div>

      </div>

      <div class="video-info">

        <div class="video-title">
          ${title}
        </div>

        <div class="video-meta">
          ${views} views • ${category}
        </div>

        <a
          class="watch-btn"
          href="${videoURL}"
          target="_blank"
          rel="noopener noreferrer">
          ▶ Watch Video
        </a>

      </div>
    `;

    grid.appendChild(card);

  });
}


/* =====================================================
   CATEGORY FILTER
   ===================================================== */

function filterCategory(category,button){

  currentCategory=category;

  document
    .querySelectorAll(".category-btn")
    .forEach(btn=>{
      btn.classList.remove("active");
    });

  button.classList.add("active");

  renderVideos();
}


/* =====================================================
   SEARCH
   ===================================================== */

document
  .getElementById("searchInput")
  .addEventListener("input",renderVideos);


/* =====================================================
   START
   ===================================================== */

loadVideos();

</script>

</body>
</html>
