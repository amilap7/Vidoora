<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Vidoora - Watch. Discover. Enjoy.</title>

<meta name="description" content="Vidoora - Watch. Discover. Enjoy.">

<style>
*{
box-sizing:border-box;
margin:0;
padding:0;
font-family:Arial,sans-serif
}

body{
background:#0b0b0d;
color:#fff;
min-height:100vh
}

header{
position:sticky;
top:0;
z-index:50;
background:#111114;
border-bottom:1px solid #25252b;
padding:14px 16px
}

.header{
max-width:1200px;
margin:auto;
display:flex;
align-items:center;
gap:12px
}

.logo{
font-size:28px;
font-weight:800;
white-space:nowrap
}

.logo span{
color:#ff1744
}

.search{
flex:1;
position:relative
}

.search input{
width:100%;
background:#1b1b20;
border:1px solid #303038;
border-radius:25px;
padding:12px 16px;
color:#fff;
outline:none
}

.menu{
font-size:27px;
cursor:pointer
}

.add-btn{
background:#ff1744;
border:0;
color:#fff;
font-weight:bold;
padding:11px 15px;
border-radius:22px;
cursor:pointer;
white-space:nowrap
}

.hero{
max-width:1200px;
margin:auto;
padding:35px 16px 20px
}

.hero h1{
font-size:38px;
margin-bottom:8px
}

.hero p{
color:#aaa;
font-size:15px
}

.categories{
max-width:1200px;
margin:auto;
padding:10px 16px 25px;
display:flex;
gap:9px;
overflow-x:auto
}

.categories button{
border:1px solid #303038;
background:#17171b;
color:#ddd;
padding:10px 17px;
border-radius:22px;
cursor:pointer;
white-space:nowrap
}

.categories button.active,
.categories button:hover{
background:#ff1744;
border-color:#ff1744;
color:#fff
}

.grid{
max-width:1200px;
margin:auto;
padding:0 16px 40px;
display:grid;
grid-template-columns:repeat(2,1fr);
gap:15px
}

.card{
background:#151519;
border:1px solid #25252b;
border-radius:12px;
overflow:hidden;
transition:.2s
}

.card:hover{
transform:translateY(-3px);
border-color:#ff1744
}

.thumb{
position:relative;
aspect-ratio:16/10;
background:#202026;
overflow:hidden
}

.thumb img{
width:100%;
height:100%;
object-fit:cover;
display:block
}

.play{
position:absolute;
left:50%;
top:50%;
transform:translate(-50%,-50%);
width:48px;
height:48px;
border-radius:50%;
background:rgba(255,23,68,.92);
display:flex;
align-items:center;
justify-content:center;
font-size:21px;
padding-left:3px
}

.duration{
position:absolute;
right:7px;
bottom:7px;
background:rgba(0,0,0,.8);
padding:4px 7px;
border-radius:5px;
font-size:12px
}

.info{
padding:11px
}

.title{
font-size:14px;
font-weight:bold;
line-height:1.35;
margin-bottom:7px
}

.meta{
font-size:12px;
color:#888;
margin-bottom:10px
}

.watch{
display:block;
text-align:center;
text-decoration:none;
background:#ff1744;
color:#fff;
padding:9px;
border-radius:7px;
font-size:13px;
font-weight:bold
}

.empty{
grid-column:1/-1;
text-align:center;
padding:50px 20px;
color:#888
}

.loading{
grid-column:1/-1;
text-align:center;
padding:50px;
color:#aaa
}

footer{
border-top:1px solid #25252b;
text-align:center;
padding:25px 15px;
color:#777;
font-size:13px
}

/* AGE WARNING */
.age-overlay{
position:fixed;
inset:0;
background:rgba(0,0,0,.94);
z-index:999;
display:flex;
align-items:center;
justify-content:center;
padding:20px
}

.age-box{
max-width:420px;
width:100%;
background:#17171b;
border:1px solid #303038;
border-radius:18px;
padding:30px 22px;
text-align:center
}

.age-icon{
font-size:48px;
margin-bottom:12px
}

.age-box h2{
font-size:25px;
margin-bottom:10px
}

.age-box p{
color:#aaa;
font-size:14px;
line-height:1.6;
margin-bottom:22px
}

.age-buttons{
display:flex;
gap:10px
}

.age-buttons button{
flex:1;
border:0;
padding:12px;
border-radius:8px;
font-weight:bold;
cursor:pointer
}

.enter{
background:#ff1744;
color:#fff
}

.leave{
background:#29292f;
color:#fff
}

@media(min-width:700px){
.grid{
grid-template-columns:repeat(3,1fr)
}
}

@media(min-width:1000px){
.grid{
grid-template-columns:repeat(4,1fr)
}
}

@media(max-width:500px){
.add-btn{
display:none
}

.hero h1{
font-size:30px
}
}
</style>
</head>

<body>

<header>
<div class="header">

<div class="logo">
Vid<span>o</span>ora
</div>

<div class="search">
<input
type="search"
id="searchInput"
placeholder="Search videos..."
autocomplete="off">
</div>

<button class="add-btn" onclick="openAdmin()">
+ Add
</button>

<div class="menu">☰</div>

</div>
</header>

<section class="hero">
<h1>Discover Videos</h1>
<p>Watch. Discover. Enjoy.</p>
</section>

<div class="categories">
<button class="active" onclick="setCategory('All',this)">All</button>
<button onclick="setCategory('New',this)">New</button>
<button onclick="setCategory('Popular',this)">Popular</button>
<button onclick="setCategory('Trending',this)">Trending</button>
</div>

<main class="grid" id="videoGrid">
<div class="loading">Loading videos...</div>
</main>

<footer>
© 2026 Vidoora. All rights reserved.
</footer>

<!-- AGE WARNING -->
<div class="age-overlay" id="ageOverlay">

<div class="age-box">

<div class="age-icon">🔞</div>

<h2>18+ Only</h2>

<p>
This website may contain age-restricted content.
You must be 18 years or older to continue.
</p>

<div class="age-buttons">

<button class="enter" onclick="enterSite()">
I am 18+
</button>

<button class="leave" onclick="leaveSite()">
Leave
</button>

</div>

</div>
</div>

<script>
/* ================================
   SUPABASE
================================ */

const SUPABASE_URL =
"https://lfsjnghkgzsghhcexgsu.supabase.co";

const SUPABASE_KEY =
"sb_publishable_xkvVadBo9ApuaE81iWdAsQ_Q8F5Efvv";


/* ================================
   AGE CHECK
================================ */

const ageOverlay =
document.getElementById("ageOverlay");

if(localStorage.getItem("vidooraAgeVerified")==="yes"){
ageOverlay.style.display="none";
}

function enterSite(){
localStorage.setItem(
"vidooraAgeVerified",
"yes"
);

ageOverlay.style.display="none";
}

function leaveSite(){
window.location.href="https://www.google.com";
}


/* ================================
   ADMIN
================================ */

function openAdmin(){
window.location.href="add-video.html";
}


/* ================================
   DATA
================================ */

let videos=[];
let currentCategory="All";


/* ================================
   LOAD VIDEOS
================================ */

async function loadVideos(){

const grid=document.getElementById("videoGrid");

try{

const response=await fetch(
SUPABASE_URL+
"/rest/v1/videos?select=*&order=created_at.desc",
{
headers:{
"apikey":SUPABASE_KEY,
"Authorization":
"Bearer "+SUPABASE_KEY
}
}
);

if(!response.ok){
throw new Error("Database request failed");
}

videos=await response.json();

renderVideos();

}catch(error){

console.error(error);

grid.innerHTML=`
<div class="empty">
Unable to load videos.<br>
Please check your Supabase connection.
</div>
`;

}

}


/* ================================
   RENDER
================================ */

function renderVideos(){

const grid=document.getElementById("videoGrid");

const search=
document.getElementById("searchInput")
.value
.toLowerCase()
.trim();

let filtered=videos.filter(video=>{

const categoryMatch=
currentCategory==="All" ||
video.category===currentCategory;

const searchMatch=
!search ||
String(video.title||"")
.toLowerCase()
.includes(search);

return categoryMatch && searchMatch;

});


if(filtered.length===0){

grid.innerHTML=`
<div class="empty">
No videos found.
</div>
`;

return;
}


grid.innerHTML=filtered.map(video=>{

const title=escapeHTML(video.title||"Untitled");
const image=escapeHTML(video.image||"");
const duration=escapeHTML(video.duration||"00:00");
const views=escapeHTML(String(video.views||"0"));
const url=escapeHTML(video.video||"#");

return`

<article class="card">

<div class="thumb">

<img
src="${image}"
alt="${title}"
loading="lazy"
onerror="this.style.display='none'">

<div class="play">▶</div>

<div class="duration">
${duration}
</div>

</div>

<div class="info">

<div class="title">
${title}
</div>

<div class="meta">
${views} views
</div>

<a
class="watch"
href="${url}"
target="_blank"
rel="noopener noreferrer">
▶ Watch Video
</a>

</div>

</article>

`;

}).join("");

}


/* ================================
   CATEGORY
================================ */

function setCategory(category,button){

currentCategory=category;

document
.querySelectorAll(".categories button")
.forEach(btn=>btn.classList.remove("active"));

button.classList.add("active");

renderVideos();

}


/* ================================
   SEARCH
================================ */

document
.getElementById("searchInput")
.addEventListener("input",renderVideos);


/* ================================
   HTML ESCAPE
================================ */

function escapeHTML(value){

return String(value)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* ================================
   START
================================ */

loadVideos();

</script>

</body>
</html>
