<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1.0">

<title>Add Video - Vidoora</title>

<meta name="theme-color" content="#0b0b0d">

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif
}

body{
  background:#0b0b0d;
  color:#fff;
  min-height:100vh
}

.container{
  width:100%;
  max-width:600px;
  margin:auto;
  padding:20px
}

.top{
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:25px
}

.back{
  width:42px;
  height:42px;
  border-radius:50%;
  border:1px solid #303036;
  background:#17171b;
  color:#fff;
  font-size:20px;
  cursor:pointer
}

.logo{
  font-size:25px;
  font-weight:800
}

.logo span{
  color:#ff1744
}

h1{
  font-size:30px;
  margin-bottom:8px
}

.subtitle{
  color:#888;
  font-size:14px;
  margin-bottom:25px
}

.form-card{
  background:#151519;
  border:1px solid #29292f;
  border-radius:16px;
  padding:20px
}

.field{
  margin-bottom:18px
}

label{
  display:block;
  font-size:13px;
  font-weight:700;
  margin-bottom:8px;
  color:#ddd
}

input,
select{
  width:100%;
  border:1px solid #34343a;
  background:#0f0f12;
  color:#fff;
  border-radius:9px;
  padding:13px;
  outline:none;
  font-size:14px
}

input:focus,
select:focus{
  border-color:#ff1744
}

select{
  appearance:auto
}

.preview{
  width:100%;
  aspect-ratio:16/9;
  background:#202025;
  border-radius:10px;
  overflow:hidden;
  margin-bottom:18px;
  display:none
}

.preview img{
  width:100%;
  height:100%;
  object-fit:cover
}

.add-btn{
  width:100%;
  padding:14px;
  border:0;
  border-radius:10px;
  background:#ff1744;
  color:#fff;
  font-weight:800;
  font-size:15px;
  cursor:pointer
}

.add-btn:disabled{
  opacity:.6;
  cursor:not-allowed
}

.message{
  margin-top:15px;
  padding:12px;
  border-radius:8px;
  display:none;
  font-size:13px;
  line-height:1.5
}

.success{
  background:#12351e;
  color:#8df0a7;
  border:1px solid #205d31
}

.error{
  background:#39151c;
  color:#ff9bab;
  border:1px solid #6c2634
}

.note{
  margin-top:18px;
  color:#777;
  font-size:12px;
  line-height:1.5;
  text-align:center
}

@media(max-width:450px){

  .container{
    padding:15px
  }

  .form-card{
    padding:16px
  }

  h1{
    font-size:27px
  }

}

</style>

</head>

<body>

<div class="container">

  <div class="top">

    <button
      class="back"
      onclick="goHome()">
      ←
    </button>

    <div class="logo">
      Vid<span>o</span>ora
    </div>

  </div>

  <h1>Add Video</h1>

  <p class="subtitle">
    Add a video link to your Vidoora database.
  </p>

  <div class="form-card">

    <!-- TITLE -->

    <div class="field">

      <label for="title">
        Video Title
      </label>

      <input
        id="title"
        type="text"
        placeholder="Enter video title"
        maxlength="150">

    </div>


    <!-- THUMBNAIL -->

    <div class="field">

      <label for="image">
        Thumbnail Image URL
      </label>

      <input
        id="image"
        type="url"
        placeholder="https://example.com/image.jpg">

    </div>


    <!-- PREVIEW -->

    <div
      class="preview"
      id="preview">

      <img
        id="previewImage"
        alt="Thumbnail preview">

    </div>


    <!-- VIDEO URL -->

    <div class="field">

      <label for="video">
        Video URL
      </label>

      <input
        id="video"
        type="url"
        placeholder="https://example.com/video">

    </div>


    <!-- CATEGORY -->

    <div class="field">

      <label for="category">
        Category
      </label>

      <select id="category">

        <option value="New">
          New
        </option>

        <option value="Popular">
          Popular
        </option>

        <option value="Trending">
          Trending
        </option>

      </select>

    </div>


    <!-- DURATION -->

    <div class="field">

      <label for="duration">
        Duration
      </label>

      <input
        id="duration"
        type="text"
        placeholder="10:25"
        maxlength="10">

    </div>


    <!-- VIEWS -->

    <div class="field">

      <label for="views">
        Views
      </label>

      <input
        id="views"
        type="text"
        placeholder="0"
        value="0"
        maxlength="20">

    </div>


    <!-- BUTTON -->

    <button
      class="add-btn"
      id="addBtn"
      onclick="addVideo()">

      Add Video

    </button>


    <!-- MESSAGE -->

    <div
      class="message"
      id="message">
    </div>

  </div>

  <div class="note">
    Video files are not uploaded to Vidoora.
    Only the external video link and thumbnail URL
    are saved in the database.
  </div>

</div>


<script>

/* =====================================================
   SUPABASE SETTINGS
   ADD YOUR OWN VALUES HERE
   ===================================================== */

const SUPABASE_URL =
  "https://lfsjnghkgzsghhcexgsu.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_xkvVadBo9ApuaE81iWdAsQ_Q8F5Efvv";


/* =====================================================
   HOME
   ===================================================== */

function goHome(){

  window.location.href="index.html";

}


/* =====================================================
   THUMBNAIL PREVIEW
   ===================================================== */

document
  .getElementById("image")
  .addEventListener("input",function(){

    const url=this.value.trim();

    const preview=
      document.getElementById("preview");

    const img=
      document.getElementById("previewImage");

    if(!url){

      preview.style.display="none";

      return;
    }

    img.src=url;

    preview.style.display="block";

  });


/* =====================================================
   MESSAGE
   ===================================================== */

function showMessage(text,type){

  const box=
    document.getElementById("message");

  box.textContent=text;

  box.className=
    "message "+type;

  box.style.display="block";

}


/* =====================================================
   ADD VIDEO
   ===================================================== */

async function addVideo(){

  const title=
    document.getElementById("title")
    .value
    .trim();

  const image=
    document.getElementById("image")
    .value
    .trim();

  const video=
    document.getElementById("video")
    .value
    .trim();

  const category=
    document.getElementById("category")
    .value;

  const duration=
    document.getElementById("duration")
    .value
    .trim() || "00:00";

  const views=
    document.getElementById("views")
    .value
    .trim() || "0";

  const button=
    document.getElementById("addBtn");


  /* CHECK SUPABASE */

  if(
    SUPABASE_URL.includes("PASTE_YOUR") ||
    SUPABASE_KEY.includes("PASTE_YOUR")
  ){

    showMessage(
      "Please add your Supabase URL and public key first.",
      "error"
    );

    return;
  }


  /* VALIDATION */

  if(!title){

    showMessage(
      "Please enter a video title.",
      "error"
    );

    return;
  }

  if(!image){

    showMessage(
      "Please enter a thumbnail image URL.",
      "error"
    );

    return;
  }

  if(!video){

    showMessage(
      "Please enter the video URL.",
      "error"
    );

    return;
  }


  /* BUTTON */

  button.disabled=true;

  button.textContent="Adding...";


  try{

    const response=await fetch(
      SUPABASE_URL+"/rest/v1/videos",
      {
        method:"POST",

        headers:{
          "Content-Type":"application/json",
          "apikey":SUPABASE_KEY,
          "Authorization":
            "Bearer "+SUPABASE_KEY,
          "Prefer":"return=minimal"
        },

        body:JSON.stringify({

          title:title,

          image:image,

          video:video,

          category:category,

          duration:duration,

          views:views

        })
      }
    );


    if(!response.ok){

      const errorText=
        await response.text();

      throw new Error(errorText);
    }


    showMessage(
      "Video added successfully! You can now view it on Vidoora.",
      "success"
    );


    /* CLEAR FORM */

    document.getElementById("title").value="";
    document.getElementById("image").value="";
    document.getElementById("video").value="";
    document.getElementById("duration").value="";
    document.getElementById("views").value="0";

    document.getElementById("preview")
      .style.display="none";


  }catch(error){

    console.error(error);

    showMessage(
      "Failed to add video. Check your Supabase URL, public key, table and RLS policies.",
      "error"
    );

  }


  button.disabled=false;

  button.textContent="Add Video";

}

</script>

</body>
</html>
