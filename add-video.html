<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Vidoora - Add Video</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#0b0b0d;
  color:#fff;
  min-height:100vh;
}

.header{
  padding:18px;
  background:#111116;
  border-bottom:1px solid #292930;
}

.logo{
  color:#ff1744;
  font-size:28px;
  font-weight:800;
  text-align:center;
}

.container{
  width:100%;
  max-width:600px;
  margin:auto;
  padding:25px 16px 50px;
}

h1{
  font-size:27px;
  margin-bottom:8px;
}

.subtitle{
  color:#999;
  margin-bottom:25px;
}

.form-box{
  background:#15151b;
  border:1px solid #292930;
  border-radius:16px;
  padding:20px;
}

label{
  display:block;
  margin:15px 0 7px;
  font-size:14px;
  font-weight:bold;
}

input,select{
  width:100%;
  padding:13px;
  border-radius:10px;
  border:1px solid #35353d;
  background:#202027;
  color:#fff;
  outline:none;
}

input:focus,select:focus{
  border-color:#ff1744;
}

.add-btn{
  width:100%;
  margin-top:24px;
  padding:14px;
  border:0;
  border-radius:10px;
  background:#ff1744;
  color:#fff;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

.add-btn:disabled{
  opacity:.6;
}

.edit-btn{
  width:100%;
  margin-top:24px;
  padding:14px;
  border:0;
  border-radius:10px;
  background:#ff1744;
  color:#fff;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

.cancel-btn{
  width:100%;
  margin-top:10px;
  padding:12px;
  border:1px solid #35353d;
  border-radius:10px;
  background:#202027;
  color:#ddd;
  cursor:pointer;
  display:none;
}

.back{
  display:block;
  text-align:center;
  margin-top:18px;
  color:#aaa;
  text-decoration:none;
}

.logout{
  display:block;
  width:100%;
  margin-top:10px;
  padding:12px;
  border:1px solid #35353d;
  border-radius:10px;
  background:#202027;
  color:#ddd;
  cursor:pointer;
}

.message{
  display:none;
  margin-top:18px;
  padding:12px;
  border-radius:9px;
  text-align:center;
  font-size:13px;
}

.success{
  background:#182818;
  color:#8cff8c;
}

.error{
  background:#35151b;
  color:#ff8a9d;
}

.preview{
  margin-top:20px;
  display:none;
}

.preview img{
  width:100%;
  border-radius:12px;
  max-height:300px;
  object-fit:cover;
}


/* =========================
   VIDEO LIST
========================= */

.video-section{
  margin-top:30px;
}

.video-section-title{
  font-size:21px;
  margin-bottom:14px;
}

.video-list{
  display:flex;
  flex-direction:column;
  gap:14px;
}

.video-item{
  background:#15151b;
  border:1px solid #292930;
  border-radius:14px;
  padding:12px;
}

.video-item-top{
  display:flex;
  gap:12px;
}

.video-thumb{
  width:110px;
  height:75px;
  flex-shrink:0;
  border-radius:9px;
  object-fit:cover;
  background:#202027;
}

.video-info{
  min-width:0;
  flex:1;
}

.video-title{
  font-size:15px;
  font-weight:bold;
  line-height:1.35;
  margin-bottom:6px;
  word-break:break-word;
}

.video-meta{
  color:#999;
  font-size:12px;
}

.video-actions{
  display:flex;
  gap:8px;
  margin-top:12px;
}

.video-actions button{
  flex:1;
  padding:10px;
  border-radius:9px;
  font-weight:bold;
  cursor:pointer;
  border:1px solid #35353d;
}

.edit-small{
  background:#202027;
  color:#fff;
}

.delete-small{
  background:#35151b;
  color:#ff8a9d;
}

.empty{
  background:#15151b;
  border:1px solid #292930;
  border-radius:14px;
  padding:20px;
  text-align:center;
  color:#999;
}

</style>

</head>

<body>

<header class="header">
  <div class="logo">Vidoora</div>
</header>

<div class="container">

<h1>Add New Video</h1>

<p class="subtitle">
Add a thumbnail, title and external video link.
</p>

<div class="form-box">

<label>Video Title</label>

<input
  type="text"
  id="title"
  placeholder="Enter video title"
>


<label>Thumbnail Image URL</label>

<input
  type="url"
  id="image"
  placeholder="https://example.com/image.jpg"
>


<label>Video URL</label>

<input
  type="url"
  id="video"
  placeholder="https://example.com/video"
>


<label>Category</label>

<select id="category">

  <option value="Popular">
    Popular
  </option>

  <option value="New">
    New
  </option>

  <option value="Trending">
    Trending
  </option>

</select>


<label>Duration</label>

<input
  type="text"
  id="duration"
  placeholder="10:25"
>


<button
  class="add-btn"
  id="addBtn"
  onclick="addVideo()"
>
  + Add Video
</button>


<button
  class="edit-btn"
  id="saveEditBtn"
  onclick="saveEdit()"
  style="display:none;"
>
  ✓ Save Changes
</button>


<button
  class="cancel-btn"
  id="cancelEditBtn"
  onclick="cancelEdit()"
>
  Cancel Edit
</button>


<div
  class="message success"
  id="successMessage"
>
  Video added successfully!
</div>


<div
  class="message error"
  id="errorMessage"
></div>


<div
  class="preview"
  id="preview"
>

  <img
    id="previewImage"
    src=""
    alt="Preview"
  >

</div>

</div>


<!-- =========================
     VIDEO MANAGEMENT
========================= -->

<div class="video-section">

<h2 class="video-section-title">
Manage Videos
</h2>

<div
  class="video-list"
  id="videoList"
>

  <div class="empty">
    Loading videos...
  </div>

</div>

</div>


<a
  href="index.html"
  class="back"
>
← Back to Vidoora
</a>


<button
  class="logout"
  onclick="logoutAdmin()"
>
Sign Out
</button>


</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
    "https://lfsjnghkgzsghhcexgsu.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_xkvVadBo9ApuaE81iWdAsQ_Q8F5Efvv";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


let editingVideoId = null;


/* =========================
   CHECK ADMIN
========================= */

async function checkAdmin(){

    const {
        data,
        error
    } =
        await supabaseClient.auth.getSession();


    if(
        error ||
        !data.session
    ){

        window.location.href =
            "admin-login.html";

        return false;

    }


    const {
        data:isAdmin,
        error:adminError
    } =
        await supabaseClient.rpc(
            "is_admin"
        );


    if(
        adminError ||
        isAdmin !== true
    ){

        await supabaseClient.auth.signOut();

        window.location.href =
            "admin-login.html";

        return false;

    }


    return true;

}


/* =========================
   ADD VIDEO
========================= */

async function addVideo(){

    const isAdmin =
        await checkAdmin();


    if(!isAdmin){
        return;
    }


    const title =
        document.getElementById(
            "title"
        ).value.trim();

    const image =
        document.getElementById(
            "image"
        ).value.trim();

    const video =
        document.getElementById(
            "video"
        ).value.trim();

    const category =
        document.getElementById(
            "category"
        ).value;

    const duration =
        document.getElementById(
            "duration"
        ).value.trim();


    if(
        !title ||
        !image ||
        !video
    ){

        showError(
            "Please enter title, image URL and video URL."
        );

        return;

    }


    const button =
        document.getElementById(
            "addBtn"
        );

    button.disabled = true;
    button.textContent =
        "Adding Video...";


    const newVideo = {

        title:title,

        image:image,

        video:video,

        category:category,

        duration:
            duration ||
            "00:00",

        views:"0"

    };


    const {
        error
    } =
        await supabaseClient
            .from("videos")
            .insert([
                newVideo
            ]);


    if(error){

        showError(
            error.message
        );

        button.disabled = false;
        button.textContent =
            "+ Add Video";

        return;

    }


    showSuccess(
        "Video added successfully!"
    );


    clearForm();

    button.disabled = false;
    button.textContent =
        "+ Add Video";


    loadVideos();

}


/* =========================
   LOAD VIDEOS
========================= */

async function loadVideos(){

    const list =
        document.getElementById(
            "videoList"
        );

    list.innerHTML =
        '<div class="empty">Loading videos...</div>';


    const {
        data,
        error
    } =
        await supabaseClient
            .from("videos")
            .select("*")
            .order(
                "created_at",
                {
                    ascending:false
                }
            );


    if(error){

        list.innerHTML =
            '<div class="empty">Unable to load videos.</div>';

        console.error(error);

        return;

    }


    if(!data || data.length === 0){

        list.innerHTML =
            '<div class="empty">No videos found.</div>';

        return;

    }


    list.innerHTML = "";


    data.forEach(function(item){

        const card =
            document.createElement(
                "div"
            );

        card.className =
            "video-item";


        card.innerHTML = `

          <div class="video-item-top">

            <img
              class="video-thumb"
              src="${escapeHTML(item.image)}"
              alt=""
              onerror="this.style.opacity='.3'"
            >

            <div class="video-info">

              <div class="video-title">
                ${escapeHTML(item.title)}
              </div>

              <div class="video-meta">
                ${escapeHTML(item.category || "New")}
                •
                ${escapeHTML(item.duration || "00:00")}
                •
                ${escapeHTML(item.views || "0")} views
              </div>

            </div>

          </div>

          <div class="video-actions">

            <button
              class="edit-small"
              onclick="editVideo(${item.id})"
            >
              ✏️ Edit
            </button>

            <button
              class="delete-small"
              onclick="deleteVideo(${item.id})"
            >
              🗑️ Delete
            </button>

          </div>

        `;


        list.appendChild(card);

    });

}


/* =========================
   EDIT VIDEO
========================= */

async function editVideo(id){

    const isAdmin =
        await checkAdmin();


    if(!isAdmin){
        return;
    }


    const {
        data,
        error
    } =
        await supabaseClient
            .from("videos")
            .select("*")
            .eq(
                "id",
                id
            )
            .maybeSingle();


    if(error || !data){

        showError(
            error
                ? error.message
                : "Video not found."
        );

        return;

    }


    editingVideoId =
        data.id;


    document.getElementById(
        "title"
    ).value =
        data.title || "";


    document.getElementById(
        "image"
    ).value =
        data.image || "";


    document.getElementById(
        "video"
    ).value =
        data.video || "";


    document.getElementById(
        "category"
    ).value =
        data.category || "New";


    document.getElementById(
        "duration"
    ).value =
        data.duration || "";


    document.getElementById(
        "previewImage"
    ).src =
        data.image || "";


    document.getElementById(
        "preview"
    ).style.display =
        data.image
            ? "block"
            : "none";


    document.getElementById(
        "addBtn"
    ).style.display =
        "none";


    document.getElementById(
        "saveEditBtn"
    ).style.display =
        "block";


    document.getElementById(
        "cancelEditBtn"
    ).style.display =
        "block";


    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

}


/* =========================
   SAVE EDIT
========================= */

async function saveEdit(){

    const isAdmin =
        await checkAdmin();


    if(!isAdmin){
        return;
    }


    if(!editingVideoId){

        showError(
            "No video selected for editing."
        );

        return;

    }


    const title =
        document.getElementById(
            "title"
        ).value.trim();

    const image =
        document.getElementById(
            "image"
        ).value.trim();

    const video =
        document.getElementById(
            "video"
        ).value.trim();

    const category =
        document.getElementById(
            "category"
        ).value;

    const duration =
        document.getElementById(
            "duration"
        ).value.trim();


    if(
        !title ||
        !image ||
        !video
    ){

        showError(
            "Please enter title, image URL and video URL."
        );

        return;

    }


    const button =
        document.getElementById(
            "saveEditBtn"
        );

    button.disabled = true;
    button.textContent =
        "Saving...";


    const {
        error
    } =
        await supabaseClient
            .from("videos")
            .update({

                title:title,

                image:image,

                video:video,

                category:category,

                duration:
                    duration ||
                    "00:00"

            })
            .eq(
                "id",
                editingVideoId
            );


    if(error){

        showError(
            error.message
        );

        button.disabled = false;
        button.textContent =
            "✓ Save Changes";

        return;

    }


    showSuccess(
        "Video updated successfully!"
    );


    cancelEdit();

    button.disabled = false;

    loadVideos();

}


/* =========================
   DELETE VIDEO
========================= */

async function deleteVideo(id){

    const isAdmin =
        await checkAdmin();


    if(!isAdmin){
        return;
    }


    const confirmed =
        confirm(
            "Are you sure you want to delete this video?"
        );


    if(!confirmed){
        return;
    }


    const {
        error
    } =
        await supabaseClient
            .from("videos")
            .delete()
            .eq(
                "id",
                id
            );


    if(error){

        showError(
            error.message
        );

        return;

    }


    showSuccess(
        "Video deleted successfully!"
    );


    if(
        editingVideoId === id
    ){

        cancelEdit();

    }


    loadVideos();

}


/* =========================
   CANCEL EDIT
========================= */

function cancelEdit(){

    editingVideoId =
        null;


    document.getElementById(
        "addBtn"
    ).style.display =
        "block";


    document.getElementById(
        "saveEditBtn"
    ).style.display =
        "none";


    document.getElementById(
        "cancelEditBtn"
    ).style.display =
        "none";


    clearForm();

}


/* =========================
   CLEAR FORM
========================= */

function clearForm(){

    document.getElementById(
        "title"
    ).value = "";

    document.getElementById(
        "image"
    ).value = "";

    document.getElementById(
        "video"
    ).value = "";

    document.getElementById(
        "duration"
    ).value = "";


    document.getElementById(
        "category"
    ).value =
        "New";


    document.getElementById(
        "preview"
    ).style.display =
        "none";

}


/* =========================
   SUCCESS
========================= */

function showSuccess(message){

    const box =
        document.getElementById(
            "successMessage"
        );

    box.textContent =
        message;

    box.style.display =
        "block";

    document.getElementById(
        "errorMessage"
    ).style.display =
        "none";


    setTimeout(function(){

        box.style.display =
            "none";

    },3000);

}


/* =========================
   ERROR
========================= */

function showError(message){

    const box =
        document.getElementById(
            "errorMessage"
        );

    box.textContent =
        message;

    box.style.display =
        "block";

    document.getElementById(
        "successMessage"
    ).style.display =
        "none";

}


/* =========================
   IMAGE PREVIEW
========================= */

document
    .getElementById("image")
    .addEventListener(
        "input",
        function(){

            const url =
                this.value.trim();

            if(url){

                document.getElementById(
                    "preview"
                ).style.display =
                    "block";

                document.getElementById(
                    "previewImage"
                ).src =
                    url;

            }else{

                document.getElementById(
                    "preview"
                ).style.display =
                    "none";

            }

        }
    );


/* =========================
   ESCAPE HTML
========================= */

function escapeHTML(value){

    return String(value ?? "")
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}


/* =========================
   LOGOUT
========================= */

async function logoutAdmin(){

    await supabaseClient.auth.signOut();

    window.location.href =
        "admin-login.html";

}


/* =========================
   START
========================= */

(async function(){

    const isAdmin =
        await checkAdmin();


    if(isAdmin){

        loadVideos();

    }

})();

</script>

</body>
</html>
