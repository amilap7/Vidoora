<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Vidoora - Add Video</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#0b0b0d;
  color:#fff;
  min-height:100vh;
}

.header{
  padding:18px;
  background:#111116;
  border-bottom:1px solid #292930;
}

.logo{
  color:#ff1744;
  font-size:28px;
  font-weight:800;
  text-align:center;
}

.container{
  width:100%;
  max-width:600px;
  margin:auto;
  padding:25px 16px 50px;
}

h1{
  font-size:27px;
  margin-bottom:8px;
}

.subtitle{
  color:#999;
  margin-bottom:25px;
}

.form-box{
  background:#15151b;
  border:1px solid #292930;
  border-radius:16px;
  padding:20px;
}

label{
  display:block;
  margin:15px 0 7px;
  font-size:14px;
  font-weight:bold;
}

input,select{
  width:100%;
  padding:13px;
  border-radius:10px;
  border:1px solid #35353d;
  background:#202027;
  color:#fff;
  outline:none;
}

input:focus,select:focus{
  border-color:#ff1744;
}

.add-btn{
  width:100%;
  margin-top:24px;
  padding:14px;
  border:0;
  border-radius:10px;
  background:#ff1744;
  color:#fff;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

.add-btn:hover{
  opacity:.9;
}

.back{
  display:block;
  text-align:center;
  margin-top:18px;
  color:#aaa;
}

.message{
  display:none;
  margin-top:18px;
  padding:12px;
  border-radius:9px;
  background:#182818;
  color:#8cff8c;
  text-align:center;
}

.preview{
  margin-top:20px;
  display:none;
}

.preview img{
  width:100%;
  border-radius:12px;
  max-height:300px;
  object-fit:cover;
}
</style>
</head>

<body>

<header class="header">
  <div class="logo">Vidoora</div>
</header>

<div class="container">

<h1>Add New Video</h1>

<p class="subtitle">
Add a thumbnail, title and external video link.
</p>

<div class="form-box">

<label>Video Title</label>
<input
  type="text"
  id="title"
  placeholder="Enter video title"
>

<label>Thumbnail Image URL</label>
<input
  type="url"
  id="image"
  placeholder="https://example.com/image.jpg"
>

<label>Video URL</label>
<input
  type="url"
  id="video"
  placeholder="https://example.com/video"
>

<label>Category</label>

<select id="category">
  <option value="popular">Popular</option>
  <option value="new">New</option>
  <option value="trending">Trending</option>
</select>

<label>Duration</label>

<input
  type="text"
  id="duration"
  placeholder="10:25"
>

<button class="add-btn" onclick="addVideo()">
  + Add Video
</button>

<div class="message" id="message">
  Video added successfully!
</div>

<div class="preview" id="preview">
  <img id="previewImage" src="" alt="Preview">
</div>

</div>

<a href="index.html" class="back">
← Back to Vidoora
</a>

</div>

<script>

function addVideo(){

  const title =
    document.getElementById("title").value.trim();

  const image =
    document.getElementById("image").value.trim();

  const video =
    document.getElementById("video").value.trim();

  const category =
    document.getElementById("category").value;

  const duration =
    document.getElementById("duration").value.trim();

  if(!title || !image || !video){

    alert("Please enter title, image URL and video URL.");

    return;
  }

  const newVideo = {

    id:Date.now(),

    title:title,

    image:image,

    video:video,

    category:category,

    duration:duration || "00:00",

    views:"0"

  };

  let videos =
    JSON.parse(localStorage.getItem("vidooraVideos") || "[]");

  videos.unshift(newVideo);

  localStorage.setItem(
    "vidooraVideos",
    JSON.stringify(videos)
  );

  document.getElementById("message").style.display="block";

  document.getElementById("title").value="";
  document.getElementById("image").value="";
  document.getElementById("video").value="";
  document.getElementById("duration").value="";

  setTimeout(function(){

    document.getElementById("message").style.display="none";

  },3000);

}

document.getElementById("image").addEventListener("input",function(){

  const url=this.value.trim();

  if(url){

    document.getElementById("preview").style.display="block";

    document.getElementById("previewImage").src=url;

  }else{

    document.getElementById("preview").style.display="none";

  }

});

</script>

</body>
</html>
