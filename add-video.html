<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Vidoora - Add Video</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#0b0b0d;
  color:#fff;
  min-height:100vh;
}

.header{
  padding:18px;
  background:#111116;
  border-bottom:1px solid #292930;
}

.logo{
  color:#ff1744;
  font-size:28px;
  font-weight:800;
  text-align:center;
}

.container{
  width:100%;
  max-width:600px;
  margin:auto;
  padding:25px 16px 50px;
}

h1{
  font-size:27px;
  margin-bottom:8px;
}

.subtitle{
  color:#999;
  margin-bottom:25px;
}

.form-box{
  background:#15151b;
  border:1px solid #292930;
  border-radius:16px;
  padding:20px;
}

label{
  display:block;
  margin:15px 0 7px;
  font-size:14px;
  font-weight:bold;
}

input,select{
  width:100%;
  padding:13px;
  border-radius:10px;
  border:1px solid #35353d;
  background:#202027;
  color:#fff;
  outline:none;
}

input:focus,select:focus{
  border-color:#ff1744;
}

.add-btn{
  width:100%;
  margin-top:24px;
  padding:14px;
  border:0;
  border-radius:10px;
  background:#ff1744;
  color:#fff;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

.add-btn:hover{
  opacity:.9;
}

.back{
  display:block;
  text-align:center;
  margin-top:18px;
  color:#aaa;
}

.message{
  display:none;
  margin-top:18px;
  padding:12px;
  border-radius:9px;
  background:#182818;
  color:#8cff8c;
  text-align:center;
}

.preview{
  margin-top:20px;
  display:none;
}

.preview img{
  width:100%;
  border-radius:12px;
  max-height:300px;
  object-fit:cover;
}
</style>
</head>

<body>

<header class="header">
  <div class="logo">Vidoora</div>
</header>

<div class="container">

<h1>Add New Video</h1>

<p class="subtitle">
Add a thumbnail, title and external video link.
</p>

<div class="form-box">

<label>Video Title</label>
<input
  type="text"
  id="title"
  placeholder="Enter video title"
>

<label>Thumbnail Image URL</label>
<input
  type="url"
  id="image"
  placeholder="https://example.com/image.jpg"
>

<label>Video URL</label>
<input
  type="url"
  id="video"
  placeholder="https://example.com/video"
>

<label>Category</label>

<select id="category">
  <option value="Popular">Popular</option>
  <option value="New">New</option>
  <option value="Trending">Trending</option>
</select>

<label>Duration</label>

<input
  type="text"
  id="duration"
  placeholder="10:25"
>

<button class="add-btn" onclick="addVideo()">
  + Add Video
</button>

<div class="message" id="message">
  Video added successfully!
</div>

<div class="preview" id="preview">
  <img id="previewImage" src="" alt="Preview">
</div>

</div>

<a href="index.html" class="back">
← Back to Vidoora
</a>

</div>


<!-- SUPABASE -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
  "https://lfsjnghkgzsghhcexgsu.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_xkvVadBo9ApuaE81iWdAsQ_Q8F5Efvv";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =========================
   ADMIN CHECK
========================= */

async function checkAdmin(){

  try{

    const {
      data:sessionData
    } =
      await supabaseClient.auth.getSession();


    const session =
      sessionData.session;


    if(!session){

      const email =
        prompt(
          "Admin Email"
        );


      if(!email){

        alert(
          "Admin login required."
        );

        window.location.href =
          "index.html";

        return false;

      }


      const password =
        prompt(
          "Admin Password"
        );


      if(!password){

        alert(
          "Admin login required."
        );

        window.location.href =
          "index.html";

        return false;

      }


      const {
        error
      } =
        await supabaseClient.auth
          .signInWithPassword({
            email:email,
            password:password
          });


      if(error){

        alert(
          "Admin login failed: " +
          error.message
        );

        window.location.href =
          "index.html";

        return false;

      }

    }


    const {
      data:userData
    } =
      await supabaseClient.auth
        .getUser();


    const user =
      userData.user;


    if(!user){

      alert(
        "Admin login required."
      );

      window.location.href =
        "index.html";

      return false;

    }


    const {
      data:adminData,
      error:adminError
    } =
      await supabaseClient
        .from("admin_users")
        .select("user_id")
        .eq(
          "user_id",
          user.id
        )
        .maybeSingle();


    if(adminError){

      console.error(
        adminError
      );

      alert(
        "Unable to verify admin account."
      );

      return false;

    }


    if(!adminData){

      alert(
        "This account is not an authorized admin."
      );

      await supabaseClient.auth.signOut();

      window.location.href =
        "index.html";

      return false;

    }


    return true;


  }catch(error){

    console.error(
      error
    );

    alert(
      "Unable to verify admin account."
    );

    return false;

  }

}


/* =========================
   ADD VIDEO
========================= */

async function addVideo(){

  const title =
    document
      .getElementById("title")
      .value
      .trim();


  const image =
    document
      .getElementById("image")
      .value
      .trim();


  const video =
    document
      .getElementById("video")
      .value
      .trim();


  const category =
    document
      .getElementById("category")
      .value;


  const duration =
    document
      .getElementById("duration")
      .value
      .trim();


  if(
    !title ||
    !image ||
    !video
  ){

    alert(
      "Please enter title, image URL and video URL."
    );

    return;

  }


  const isAdmin =
    await checkAdmin();


  if(!isAdmin){

    return;

  }


  const newVideo = {

    title:title,

    image:image,

    video:video,

    category:category,

    duration:
      duration ||
      "00:00",

    views:"0"

  };


  const {
    error
  } =
    await supabaseClient
      .from("videos")
      .insert([
        newVideo
      ]);


  if(error){

    console.error(
      "Insert error:",
      error
    );

    alert(
      "Video could not be added: " +
      error.message
    );

    return;

  }


  document.getElementById(
    "message"
  ).style.display =
    "block";


  document.getElementById(
    "title"
  ).value = "";


  document.getElementById(
    "image"
  ).value = "";


  document.getElementById(
    "video"
  ).value = "";


  document.getElementById(
    "duration"
  ).value = "";


  document.getElementById(
    "preview"
  ).style.display =
    "none";


  setTimeout(function(){

    document.getElementById(
      "message"
    ).style.display =
      "none";

  },3000);

}


/* =========================
   IMAGE PREVIEW
========================= */

document
  .getElementById("image")
  .addEventListener(
    "input",
    function(){

      const url =
        this.value.trim();


      if(url){

        document.getElementById(
          "preview"
        ).style.display =
          "block";


        document.getElementById(
          "previewImage"
        ).src =
          url;

      }else{

        document.getElementById(
          "preview"
        ).style.display =
          "none";

      }

    }
  );

</script>

</body>
</html>
